<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="710" height="440" fill="#ffffff"/>

  <!-- mano IZQUIERDA con la palma hacia ti: pulgar a la IZQUIERDA; luego índice, medio, anular, meñique -->
  <rect x="146" y="100" width="40" height="165" rx="18" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <rect x="194" y="75"  width="40" height="190" rx="18" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <rect x="242" y="85"  width="40" height="180" rx="18" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <rect x="290" y="115" width="40" height="150" rx="18" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <!-- palma -->
  <rect x="140" y="252" width="196" height="130" rx="36" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
  <!-- pulgar (a la izquierda) -->
  <ellipse cx="106" cy="292" rx="26" ry="62" transform="rotate(40 106 292)" fill="#e3e3e3" stroke="#666666" stroke-width="2"/>

  <!-- puntas con número y color -->
  <circle cx="166" cy="122" r="15" fill="#d23333"/><text x="166" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="214" cy="97"  r="15" fill="#e8820c"/><text x="214" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="262" cy="107" r="15" fill="#2e9e44"/><text x="262" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="310" cy="137" r="15" fill="#2b6cb0"/><text x="310" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>

  <!-- leyenda -->
  <circle cx="452" cy="115" r="12" fill="#d23333"/><text x="452" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="472" y="120" font-size="14.5" fill="#333333">índice</text>
  <circle cx="452" cy="150" r="12" fill="#e8820c"/><text x="452" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="472" y="155" font-size="14.5" fill="#333333">medio</text>
  <circle cx="452" cy="185" r="12" fill="#2e9e44"/><text x="452" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="472" y="190" font-size="14.5" fill="#333333">anular</text>
  <circle cx="452" cy="220" r="12" fill="#2b6cb0"/><text x="452" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="472" y="225" font-size="14.5" fill="#333333">meñique</text>

  <text x="440" y="290" font-size="14" fill="#333333">El <tspan font-weight="bold">pulgar</tspan> no tiene número:</text>
  <text x="440" y="310" font-size="14" fill="#333333">va detrás del mástil, sosteniendo.</text>
  <line x1="132" y1="330" x2="432" y2="296" stroke="#999999" stroke-width="1.2"/>

  <text x="238" y="420" text-anchor="middle" font-size="12.5" fill="#777777">Tu mano izquierda, con la palma hacia ti: el pulgar queda a la izquierda.</text>
</svg>
