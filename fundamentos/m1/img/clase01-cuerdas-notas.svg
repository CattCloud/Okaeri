<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="300" fill="#ffffff"/>

  <text x="200" y="40" font-size="13.5" fill="#333333">Las 6 cuerdas al aire, como las ves al tocar (la gruesa arriba):</text>

  <line x1="200" y1="70"  x2="620" y2="70"  stroke="#333333" stroke-width="6"/>
  <line x1="200" y1="100" x2="620" y2="100" stroke="#333333" stroke-width="5"/>
  <line x1="200" y1="130" x2="620" y2="130" stroke="#333333" stroke-width="4"/>
  <line x1="200" y1="160" x2="620" y2="160" stroke="#333333" stroke-width="3"/>
  <line x1="200" y1="190" x2="620" y2="190" stroke="#333333" stroke-width="2.2"/>
  <line x1="200" y1="220" x2="620" y2="220" stroke="#333333" stroke-width="1.4"/>

  <text x="190" y="75"  text-anchor="end" font-size="15" font-weight="bold" fill="#111111">6ª</text>
  <text x="190" y="105" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">5ª</text>
  <text x="190" y="135" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">4ª</text>
  <text x="190" y="165" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">3ª</text>
  <text x="190" y="195" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">2ª</text>
  <text x="190" y="225" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">1ª</text>

  <text x="640" y="75"  font-size="15" fill="#111111"><tspan font-weight="bold">Mi (E)</tspan> — la más gruesa</text>
  <text x="640" y="105" font-size="15" fill="#111111"><tspan font-weight="bold">La (A)</tspan></text>
  <text x="640" y="135" font-size="15" fill="#111111"><tspan font-weight="bold">Re (D)</tspan></text>
  <text x="640" y="165" font-size="15" fill="#111111"><tspan font-weight="bold">Sol (G)</tspan></text>
  <text x="640" y="195" font-size="15" fill="#111111"><tspan font-weight="bold">Si (B)</tspan></text>
  <text x="640" y="225" font-size="15" fill="#111111"><tspan font-weight="bold">Mi (e)</tspan> — la más fina</text>

  <text x="200" y="262" font-size="13.5" fill="#333333">Tu afinador las nombra en letras: <tspan font-weight="bold" font-family="Consolas, monospace">E · A · D · G · B · E</tspan></text>
  <text x="200" y="284" font-size="13" fill="#777777">De la gruesa a la fina se dice rápido: Mi - La - Re - Sol - Si - Mi.</text>
</svg>
