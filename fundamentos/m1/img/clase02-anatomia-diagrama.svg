<text x="255" y="58" font-size="13.5" fill="#333333">✕ = esta cuerda NO se toca · ○ = se toca al aire (sin pisar)</text>
<text x="255" y="78" font-size="13.5" fill="#333333">La barra gruesa de arriba es la cejuela (el traste 0).</text>
<text x="255" y="120" font-size="13.5" fill="#333333">Punto = dónde pisa un dedo. El número dice CUÁL dedo:</text>
