<text x="255" y="190" font-size="13.5" fill="#333333">Izquierda = 6ª cuerda (la gruesa) · derecha = 1ª (la fina).</text>
<text x="255" y="210" font-size="13.5" fill="#333333">Es la guitarra vista de frente, parada.</text>
<text x="255" y="252" font-size="13.5" fill="#333333">Se lee: pisa lo marcado, y toca SOLO las cuerdas sin ✕.</text>
