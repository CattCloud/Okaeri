<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>

  <text x="230" y="52" font-size="13" fill="#333333">La línea de ARRIBA es la <tspan font-weight="bold">1ª — la más fina</tspan> (parece al revés: es el mástil inclinado hacia ti)</text>
  <line x1="245" y1="60" x2="245" y2="84" stroke="#999999" stroke-width="1.2"/>

  <!-- 6 líneas de TAB -->
  <line x1="230" y1="90"  x2="640" y2="90"  stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="115" x2="640" y2="115" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="640" y2="140" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="165" x2="640" y2="165" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="190" x2="640" y2="190" stroke="#333333" stroke-width="1.5"/>
  <line x1="230" y1="215" x2="640" y2="215" stroke="#333333" stroke-width="1.5"/>

  <text x="220" y="94"  text-anchor="end" font-size="12.5" fill="#333333">1ª — Mi (fina)</text>
  <text x="220" y="119" text-anchor="end" font-size="12.5" fill="#333333">2ª — Si</text>
  <text x="220" y="144" text-anchor="end" font-size="12.5" fill="#333333">3ª — Sol</text>
  <text x="220" y="169" text-anchor="end" font-size="12.5" fill="#333333">4ª — Re</text>
  <text x="220" y="194" text-anchor="end" font-size="12.5" fill="#333333">5ª — La</text>
  <text x="220" y="219" text-anchor="end" font-size="12.5" fill="#333333">6ª — Mi (gruesa)</text>

  <!-- un 0 (al aire) en la 5ª -->
  <rect x="271" y="180" width="18" height="20" fill="#ffffff"/><text x="280" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">0</text>
  <line x1="280" y1="202" x2="280" y2="252" stroke="#999999" stroke-width="1.2"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#333333">0 = cuerda al aire</text>

  <!-- secuencia 2, 3 en la 3ª -->
  <rect x="386" y="130" width="18" height="20" fill="#ffffff"/><text x="395" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2</text>
  <rect x="431" y="130" width="18" height="20" fill="#ffffff"/><text x="440" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3</text>
  <line x1="417" y1="150" x2="417" y2="278" stroke="#999999" stroke-width="1.2"/>
  <text x="417" y="296" text-anchor="middle" font-size="12.5" fill="#333333">número = TRASTE que pisas (no dedo)</text>

  <!-- columna apilada: Em -->
  <rect x="551" y="80"  width="18" height="20" fill="#ffffff"/><text x="560" y="96"  text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">0</text>
  <rect x="551" y="105" width="18" height="20" fill="#ffffff"/><text x="560" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">0</text>
  <rect x="551" y="130" width="18" height="20" fill="#ffffff"/><text x="560" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">0</text>
  <rect x="551" y="155" width="18" height="20" fill="#ffffff"/><text x="560" y="171" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2</text>
  <rect x="551" y="180" width="18" height="20" fill="#ffffff"/><text x="560" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2</text>
  <rect x="551" y="205" width="18" height="20" fill="#ffffff"/><text x="560" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">0</text>

  <polyline points="585,85 592,85 592,220 585,220" fill="none" stroke="#999999" stroke-width="1.4"/>
  <text x="654" y="138" font-size="13" fill="#333333">números apilados =</text>
  <text x="654" y="156" font-size="13" font-weight="bold" fill="#333333">suenan A LA VEZ</text>
  <text x="654" y="174" font-size="13" fill="#333333">(esto es un acorde: Em)</text>

  <text x="230" y="326" font-size="13" fill="#555555">Se lee de izquierda a derecha, como un texto →</text>
</svg>
