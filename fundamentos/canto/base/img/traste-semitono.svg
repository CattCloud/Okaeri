<text x="58" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#22883a">Mi</text>
<text x="58" y="64" text-anchor="middle" font-size="11" fill="#555555">al aire</text>
<text x="745" y="186" text-anchor="end" font-size="14" font-weight="bold" fill="#22883a">traste 12: otra vez Mi</text>
<text x="745" y="204" text-anchor="end" font-size="12" fill="#333333">la misma nota, una octava arriba</text>
<polyline points="74,58 118.5,58" fill="none" stroke="#cc2222" stroke-width="2"/>
<polygon points="120.5,58 112.5,53 112.5,63" fill="#cc2222"/>
<text x="130.5" y="62" font-size="13" font-weight="bold" fill="#cc2222">1 traste = 1 semitono (el paso más chico)</text>
<text x="380" y="222" text-anchor="middle" font-size="13" fill="#333333">12 semitonos = 1 octava. Por eso el traste 12 repite la nota de la cuerda al aire.</text>
