<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="390" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="24" font-weight="bold" fill="#111111">V2 · papel en la pared</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Pegas el papel con la mano, soplas un chorro fino al centro y sueltas la mano.</text>
<text x="40" y="96" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Cuenta cuántos segundos se sostiene. Si llegas a 10 s, un paso atrás.</text>
<line x1="760" y1="110" x2="760" y2="330" stroke="#333333" stroke-width="4"/><line x1="760" y1="125" x2="774" y2="111" stroke="#999999" stroke-width="1.5"/><line x1="760" y1="165" x2="774" y2="151" stroke="#999999" stroke-width="1.5"/><line x1="760" y1="205" x2="774" y2="191" stroke="#999999" stroke-width="1.5"/><line x1="760" y1="245" x2="774" y2="231" stroke="#999999" stroke-width="1.5"/><line x1="760" y1="285" x2="774" y2="271" stroke="#999999" stroke-width="1.5"/><text x="800" y="224" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">pared</text><rect x="750" y="190" width="10" height="52" fill="#ffffff" stroke="#111111" stroke-width="2.5"/><text x="722" y="178" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">papel de 5 a 10 cm</text><text x="722" y="196" text-anchor="end" font-size="14" font-weight="normal" fill="#333333">pegado solo por el aire</text><circle cx="150" cy="220" r="46" fill="none" stroke="#333333" stroke-width="2.5"/><path d="M 192 214 Q 202 220 192 226" fill="none" stroke="#333333" stroke-width="2.5"/><line x1="206" y1="210" x2="748" y2="214" stroke="#2b6cb0" stroke-width="2"/><line x1="206" y1="220" x2="748" y2="216" stroke="#2b6cb0" stroke-width="2.8"/><line x1="206" y1="230" x2="748" y2="218" stroke="#2b6cb0" stroke-width="2"/><text x="470" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">aire fino, parejo y apuntado al papel</text><line x1="210" y1="318" x2="745" y2="318" stroke="#999999" stroke-width="1.5"/><line x1="210" y1="312" x2="210" y2="324" stroke="#999999" stroke-width="1.5"/><line x1="745" y1="312" x2="745" y2="324" stroke="#999999" stroke-width="1.5"/><text x="478" y="342" text-anchor="middle" font-size="14" font-weight="normal" fill="#555555">~30 cm al empezar</text>
<text x="40" y="372" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">Labios como para soplar una vela. Si el chorro es débil o a golpes, el papel se cae.</text>
</svg>
