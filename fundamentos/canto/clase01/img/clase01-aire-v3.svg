<text x="40" y="44" text-anchor="start" font-size="24" font-weight="bold" fill="#111111">V3 · siseo</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Inhalas bajo y sueltas una «sssss» pareja y larga. Cronométrala.</text>
<text x="40" y="96" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Termina cuando el sonido pierde fuerza, sin exprimirte hasta que no quede aire.</text>
<text x="40" y="140" text-anchor="start" font-size="18" font-weight="bold" fill="#2e9e44">Así</text><text x="40" y="160" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">parejo de inicio a fin</text><rect x="230" y="126" width="640" height="14" rx="7" fill="#2e9e44"/><text x="230" y="118" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">sssssssssssssssssssssssss</text><text x="40" y="250" text-anchor="start" font-size="18" font-weight="bold" fill="#d23333">No</text><text x="40" y="270" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">arranca fuerte y muere</text><polygon points="230,236 870,254 870,258 230,276" fill="#bbbbbb"/><text x="230" y="228" text-anchor="start" font-size="18" font-weight="bold" fill="#888888">ssssssssssss·····</text><line x1="886" y1="247" x2="904" y2="265" stroke="#d23333" stroke-width="3"/><line x1="904" y1="247" x2="886" y2="265" stroke="#d23333" stroke-width="3"/>
