<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">El pulso y el compás de 4/4</text>
  <text x="60" y="70" text-anchor="start" font-size="15.5" font-weight="bold" fill="#111111">El pulso: golpes parejos, todos a la misma distancia</text>
  <circle cx="100" cy="120" r="17" fill="#555555"/>
  <circle cx="200" cy="120" r="17" fill="#555555"/>
  <circle cx="300" cy="120" r="17" fill="#555555"/>
  <circle cx="400" cy="120" r="17" fill="#555555"/>
  <circle cx="500" cy="120" r="17" fill="#555555"/>
  <circle cx="600" cy="120" r="17" fill="#555555"/>
  <circle cx="700" cy="120" r="17" fill="#555555"/>
  <circle cx="800" cy="120" r="17" fill="#555555"/>
  <line x1="100" y1="156" x2="200" y2="156" stroke="#d23333" stroke-width="2.5" />
  <line x1="100" y1="150" x2="100" y2="162" stroke="#d23333" stroke-width="2.5" />
  <line x1="200" y1="150" x2="200" y2="162" stroke="#d23333" stroke-width="2.5" />
  <text x="150" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#d23333">60 BPM: 1 segundo</text>
  <text x="450" y="208" text-anchor="middle" font-size="13"  fill="#555555">El metrónomo hace este «tic» por ti. Más BPM = golpes más seguidos.</text>
  <line x1="60" y1="232" x2="840" y2="232" stroke="#dddddd" stroke-width="1.5" />
  <text x="60" y="262" text-anchor="start" font-size="15.5" font-weight="bold" fill="#111111">El compás de 4/4: cajas de 4 pulsos</text>
  <rect x="60" y="304" width="370" height="76" fill="none" stroke="#111111" stroke-width="1.8"/>
  <circle cx="110" cy="342" r="22" fill="#d23333"/>
  <text x="110" y="349" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="200" cy="342" r="17" fill="#555555"/>
  <text x="200" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="290" cy="342" r="17" fill="#555555"/>
  <text x="290" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="380" cy="342" r="17" fill="#555555"/>
  <text x="380" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
  <rect x="470" y="304" width="370" height="76" fill="none" stroke="#111111" stroke-width="1.8"/>
  <circle cx="520" cy="342" r="22" fill="#d23333"/>
  <text x="520" y="349" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="610" cy="342" r="17" fill="#555555"/>
  <text x="610" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="700" cy="342" r="17" fill="#555555"/>
  <text x="700" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="790" cy="342" r="17" fill="#555555"/>
  <text x="790" y="349" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
  <text x="245" y="402" text-anchor="middle" font-size="12.5"  fill="#555555">una caja: 4 pulsos</text>
  <text x="655" y="402" text-anchor="middle" font-size="12.5"  fill="#555555">la siguiente caja: se repite</text>
  <text x="450" y="282" text-anchor="middle" font-size="13.5"  fill="#111111"></text>
  <text x="115" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d23333">tiempo fuerte</text>
</svg>
