<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">La corchea: media negra</text>
<ellipse cx="160" cy="115" rx="10" ry="7" fill="#111111"/><line x1="169" y1="113" x2="169" y2="79" stroke="#111111" stroke-width="2"/><text x="160" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Negra</text>
  <text x="160" y="182" text-anchor="middle" font-size="13" fill="#555555">dura 1 tiempo (1 clic)</text>
<ellipse cx="445" cy="115" rx="10" ry="7" fill="#111111"/><line x1="454" y1="113" x2="454" y2="79" stroke="#111111" stroke-width="2"/><path d="M 454,79 c 12,4 16,14 9,28" fill="none" stroke="#111111" stroke-width="2.5"/><text x="450" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Corchea</text>
  <text x="450" y="182" text-anchor="middle" font-size="13" fill="#555555">dura ½ tiempo</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#888888">la banderita del palito se llama «corchete»</text>
<ellipse cx="705" cy="115" rx="10" ry="7" fill="#111111"/><ellipse cx="747" cy="115" rx="10" ry="7" fill="#111111"/><line x1="714" y1="113" x2="714" y2="79" stroke="#111111" stroke-width="2"/><line x1="756" y1="113" x2="756" y2="79" stroke="#111111" stroke-width="2"/><rect x="713" y="77" width="44" height="5.5" fill="#111111"/><text x="726" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Dos corcheas unidas</text>
  <text x="726" y="182" text-anchor="middle" font-size="13" fill="#555555">la barra reemplaza a los corchetes</text>
  <text x="726" y="200" text-anchor="middle" font-size="12" fill="#888888">juntas suman 1 tiempo: ½ + ½</text>
<line x1="60" y1="222" x2="840" y2="222" stroke="#dddddd" stroke-width="1.5"/>
  <text x="60" y="255" font-size="15.5" font-weight="bold" fill="#111111">En cada clic caben dos: se cuenta «1 y 2 y 3 y 4 y»</text>
  <text x="60" y="280" font-size="13.5" fill="#333333">La primera corchea cae CON el clic (el número); la segunda cae exactamente a la mitad, entre clic y clic (la «y»).</text>
<rect x="110" y="310" width="680" height="80" fill="none" stroke="#111111" stroke-width="1.8"/>
<line x1="280" y1="310" x2="280" y2="390" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="450" y1="310" x2="450" y2="390" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="620" y1="310" x2="620" y2="390" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
<ellipse cx="152" cy="358" rx="10" ry="7" fill="#111111"/><ellipse cx="194" cy="358" rx="10" ry="7" fill="#111111"/><line x1="161" y1="356" x2="161" y2="322" stroke="#111111" stroke-width="2"/><line x1="203" y1="356" x2="203" y2="322" stroke="#111111" stroke-width="2"/><rect x="160" y="320" width="44" height="5.5" fill="#111111"/><text x="152" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1</text>
<text x="194" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#d23333">y</text>
<text x="152" y="432" text-anchor="middle" font-size="10.5" fill="#888888">clic</text>
<ellipse cx="322" cy="358" rx="10" ry="7" fill="#111111"/><ellipse cx="364" cy="358" rx="10" ry="7" fill="#111111"/><line x1="331" y1="356" x2="331" y2="322" stroke="#111111" stroke-width="2"/><line x1="373" y1="356" x2="373" y2="322" stroke="#111111" stroke-width="2"/><rect x="330" y="320" width="44" height="5.5" fill="#111111"/><text x="322" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2</text>
<text x="364" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#d23333">y</text>
<text x="322" y="432" text-anchor="middle" font-size="10.5" fill="#888888">clic</text>
<ellipse cx="492" cy="358" rx="10" ry="7" fill="#111111"/><ellipse cx="534" cy="358" rx="10" ry="7" fill="#111111"/><line x1="501" y1="356" x2="501" y2="322" stroke="#111111" stroke-width="2"/><line x1="543" y1="356" x2="543" y2="322" stroke="#111111" stroke-width="2"/><rect x="500" y="320" width="44" height="5.5" fill="#111111"/><text x="492" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">3</text>
<text x="534" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#d23333">y</text>
<text x="492" y="432" text-anchor="middle" font-size="10.5" fill="#888888">clic</text>
<ellipse cx="662" cy="358" rx="10" ry="7" fill="#111111"/><ellipse cx="704" cy="358" rx="10" ry="7" fill="#111111"/><line x1="671" y1="356" x2="671" y2="322" stroke="#111111" stroke-width="2"/><line x1="713" y1="356" x2="713" y2="322" stroke="#111111" stroke-width="2"/><rect x="670" y="320" width="44" height="5.5" fill="#111111"/><text x="662" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">4</text>
<text x="704" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#d23333">y</text>
<text x="662" y="432" text-anchor="middle" font-size="10.5" fill="#888888">clic</text>
<text x="450" y="480" text-anchor="middle" font-size="12.5" fill="#555555">Ocho corcheas llenan la caja del 4/4: ½ × 8 = 4. El metrónomo solo marca los números; la «y» la pones tú.</text>
</svg>
