<text x="40" y="74" font-size="16" fill="#333333">Modo A: un rasgueo hacia abajo en el 1 (caja partida: en el 1 y en el 3).</text>
<text x="40" y="96" font-size="16" fill="#333333">Modo B: un rasgueo hacia abajo en cada tiempo, contando 1-2-3-4.</text>
