<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#111111">V3 · dedos que se quedan</text>
  <text x="40" y="74" font-size="16" fill="#333333">Tocas solo el dedo nuevo; los anteriores siguen pisando. Bajando (4-3-2-1) se levantan de a uno.</text><text x="40" y="124" font-size="15" font-weight="bold" fill="#111111">Pisando 1</text><line x1="40" y1="190" x2="236" y2="190" stroke="#333333" stroke-width="2"/><line x1="40" y1="166" x2="40" y2="214" stroke="#999999" stroke-width="4"/><line x1="89" y1="166" x2="89" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="138" y1="166" x2="138" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="187" y1="166" x2="187" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="236" y1="166" x2="236" y2="214" stroke="#999999" stroke-width="1.5"/><circle cx="64.5" cy="190" r="15" fill="#d23333"/><text x="64.5" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text><text x="64.5" y="238" text-anchor="middle" font-size="13" fill="#888888">1</text><text x="113.5" y="238" text-anchor="middle" font-size="13" fill="#888888">2</text><text x="162.5" y="238" text-anchor="middle" font-size="13" fill="#888888">3</text><text x="211.5" y="238" text-anchor="middle" font-size="13" fill="#888888">4</text><text x="260" y="124" font-size="15" font-weight="bold" fill="#111111">Pisando 1 + 2</text><line x1="260" y1="190" x2="456" y2="190" stroke="#333333" stroke-width="2"/><line x1="260" y1="166" x2="260" y2="214" stroke="#999999" stroke-width="4"/><line x1="309" y1="166" x2="309" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="358" y1="166" x2="358" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="407" y1="166" x2="407" y2="214" stroke="#999999" stroke-width="1.5"/><line x1="456" y1="166" x2="456" y2="214" stroke="#999999" stroke-width="1.5"/><circle cx="284.5" cy="190" r="14" fill="#ffffff" stroke="#d23333" stroke-width="3"/><text x="284.5" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#d23333">1</text><circle cx="333.5" cy="190" r="15" fill="#e8820c"/><text x="333.