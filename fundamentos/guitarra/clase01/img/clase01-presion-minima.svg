<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="250" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#111111">Presión mínima</text>
  <text x="40" y="74" font-size="16" fill="#333333">Afloja hasta que zumbe; aprieta apenas hasta que vuelva a sonar limpia. Ahí te quedas.</text><rect x="40" y="120" width="280" height="46" fill="#f1f1f1" stroke="#888888"/><rect x="320" y="120" width="280" height="46" fill="#2e9e44"/><rect x="600" y="120" width="320" height="46" fill="#f1f1f1" stroke="#888888"/><text x="180" y="149" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">Muy poca: zumba</text><text x="460" y="149" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">La justa: suena limpia</text><text x="760" y="149" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">De más: cansa la mano</text><text x="40" y="198" font-size="14" fill="#555555">menos fuerza</text><text x="920" y="198" text-anchor="end" font-size="14" fill="#555555">más fuerza</text></svg>