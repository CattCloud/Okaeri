<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="375" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Ejercicio 1-2-3-4 (versión 1) — así se ve en TAB</text>

  <!-- TAB staff: 6 lines, top = 1st string -->
  <line x1="205" y1="75"  x2="870" y2="75"  stroke="#333333" stroke-width="1.5"/>
  <line x1="205" y1="100" x2="870" y2="100" stroke="#333333" stroke-width="1.5"/>
  <line x1="205" y1="125" x2="870" y2="125" stroke="#333333" stroke-width="1.5"/>
  <line x1="205" y1="150" x2="870" y2="150" stroke="#333333" stroke-width="1.5"/>
  <line x1="205" y1="175" x2="870" y2="175" stroke="#333333" stroke-width="1.5"/>
  <line x1="205" y1="200" x2="870" y2="200" stroke="#333333" stroke-width="1.5"/>

  <!-- string labels -->
  <text x="195" y="79"  text-anchor="end" font-size="13" fill="#333333">1ª — Mi (la más fina)</text>
  <text x="195" y="104" text-anchor="end" font-size="13" fill="#333333">2ª — Si</text>
  <text x="195" y="129" text-anchor="end" font-size="13" fill="#333333">3ª — Sol</text>
  <text x="195" y="154" text-anchor="end" font-size="13" fill="#333333">4ª — Re</text>
  <text x="195" y="179" text-anchor="end" font-size="13" fill="#333333">5ª — La</text>
  <text x="195" y="204" text-anchor="end" font-size="13" fill="#333333">6ª — Mi (la más gruesa)</text>

  <!-- numbers on 6th string (start) -->
  <rect x="231" y="190" width="18" height="20" fill="#ffffff"/><text x="240" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1</text>
  <rect x="276" y="190" width="18" height="20" fill="#ffffff"/><text x="285" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2</text>
  <rect x="321" y="190" width="18" height="20" fill="#ffffff"/><text x="330" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3</text>
  <rect x="366" y="190" width="18" height="20" fill="#ffffff"/><text x="375" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4</text>

  <!-- numbers on 5th string -->
  <rect x="411" y="165" width="18" height="20" fill="#ffffff"/><text x="420" y="181" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1</text>
  <rect x="456" y="165" width="18" height="20" fill="#ffffff"/><text x="465" y="181" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2</text>
  <rect x="501" y="165" width="18" height="20" fill="#ffffff"/><text x="510" y="181" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3</text>
  <rect x="546" y="165" width="18" height="20" fill="#ffffff"/><text x="555" y="181" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4</text>

  <!-- ellipsis on 4th string -->
  <rect x="596" y="140" width="34" height="20" fill="#ffffff"/><text x="613" y="156" text-anchor="middle" font-size="20" font-weight="bold" fill="#888888">⋯</text>

  <!-- numbers on 1st string (end) -->
  <rect x="691" y="65" width="18" height="20" fill="#ffffff"/><text x="700" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1</text>
  <rect x="736" y="65" width="18" height="20" fill="#ffffff"/><text x="745" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2</text>
  <rect x="781" y="65" width="18" height="20" fill="#ffffff"/><text x="790" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3</text>
  <rect x="826" y="65" width="18" height="20" fill="#ffffff"/><text x="835" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4</text>

  <!-- reading notes -->
  <text x="205" y="243" font-size="13.5" fill="#111111">Se lee de izquierda a derecha. Cada número es el TRASTE que pisas en esa cuerda (un 0 sería cuerda al aire).</text>
  <text x="205" y="265" font-size="13" fill="#666666">Empiezas en la 6ª, sigues por la 5ª, 4ª, 3ª, 2ª hasta la 1ª — y regresas bajando igual, en ciclo.</text>

  <!-- finger legend -->
  <text x="205" y="303" font-size="13.5" font-weight="bold" fill="#111111">Qué dedo usa cada traste (un dedo por traste):</text>
  <circle cx="230" cy="330" r="12" fill="#d23333"/><text x="230" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="250" y="335" font-size="12.5" fill="#333333">traste 1 — índice</text>
  <circle cx="420" cy="330" r="12" fill="#e8820c"/><text x="420" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="440" y="335" font-size="12.5" fill="#333333">traste 2 — medio</text>
  <circle cx="610" cy="330" r="12" fill="#2e9e44"/><text x="610" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="630" y="335" font-size="12.5" fill="#333333">traste 3 — anular</text>
  <circle cx="790" cy="330" r="12" fill="#2b6cb0"/><text x="790" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="810" y="335" font-size="12.5" fill="#333333">traste 4 — meñique</text>
</svg>
