<text x="120" y="360" font-size="13.5" fill="#333333">El número dentro del punto es el <tspan font-weight="bold">dedo</tspan>:</text>
  <circle cx="400" cy="355" r="10" fill="#d23333"/><text x="400" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="418" y="360" font-size="13" fill="#333333">índice (traste 5)</text>
  <circle cx="560" cy="355" r="10" fill="#2e9e44"/><text x="560" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="578" y="360" font-size="13" fill="#333333">anular (traste 7)</text>
  <circle cx="725" cy="355" r="10" fill="#2b6cb0"/><text x="725" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="743" y="360" font-size="13" fill="#333333">meñique (traste 8)</text>
  <text x="450" y="390" text-anchor="middle" font-size="12.5" fill="#555555">Las 5 notas: La–Do–Re–Mi–Sol (A–C–D–E–G), repetidas por las seis cuerdas. En rojo, cada <tspan font-weight="bold" fill="#d23333">La</tspan>: la nota que da nombre a la escala.</text>
