<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 290" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="650" height="290" fill="#ffffff"/>

  <!-- White keys: 15 keys, ~2 octavas -->
  <g fill="#ffffff" stroke="#333333" stroke-width="1.8">
    <rect x="40"  y="78" width="38" height="165" rx="2"/>
    <rect x="78"  y="78" width="38" height="165" rx="2"/>
    <rect x="116" y="78" width="38" height="165" rx="2"/>
    <rect x="154" y="78" width="38" height="165" rx="2"/>
    <rect x="192" y="78" width="38" height="165" rx="2"/>
    <rect x="230" y="78" width="38" height="165" rx="2"/>
    <rect x="268" y="78" width="38" height="165" rx="2"/>
    <rect x="306" y="78" width="38" height="165" rx="2"/>
    <rect x="344" y="78" width="38" height="165" rx="2"/>
    <rect x="382" y="78" width="38" height="165" rx="2"/>
    <rect x="420" y="78" width="38" height="165" rx="2"/>
    <rect x="458" y="78" width="38" height="165" rx="2"/>
    <rect x="496" y="78" width="38" height="165" rx="2"/>
    <rect x="534" y="78" width="38" height="165" rx="2"/>
    <rect x="572" y="78" width="38" height="165" rx="2"/>
  </g>

  <!-- Black keys (5 per octave) -->
  <g fill="#1a1a1a">
    <rect x="66"  y="78" width="24" height="105" rx="2"/>
    <rect x="104" y="78" width="24" height="105" rx="2"/>
    <rect x="180" y="78" width="24" height="105" rx="2"/>
    <rect x="218" y="78" width="24" height="105" rx="2"/>
    <rect x="256" y="78" width="24" height="105" rx="2"/>
    <rect x="332" y="78" width="24" height="105" rx="2"/>
    <rect x="370" y="78" width="24" height="105" rx="2"/>
    <rect x="446" y="78" width="24" height="105" rx="2"/>
    <rect x="484" y="78" width="24" height="105" rx="2"/>
    <rect x="522" y="78" width="24" height="105" rx="2"/>
  </g>

  <!-- Blue dots + "Do" on every Do key (i = 0, 7, 14) -->
  <g>
    <circle cx="59"  cy="203" r="6" fill="#1565C0"/>
    <circle cx="325" cy="203" r="6" fill="#1565C0"/>
    <circle cx="591" cy="203" r="6" fill="#1565C0"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    <text x="59"  y="229">Do</text>
    <text x="325" y="229">Do</text>
    <text x="591" y="229">Do</text>
  </g>

  <!-- Red arrow + label on the central Do -->
  <text x="325" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#D32F2F">Do central</text>
  <line x1="325" y1="50" x2="325" y2="68" stroke="#D32F2F" stroke-width="3"/>
  <polygon points="318,66 332,66 325,77" fill="#D32F2F"/>

  <!-- Reinforcing caption -->
  <text x="325" y="272" text-anchor="middle" font-size="13" fill="#666666">Do está a la izquierda de cada grupo de 2 teclas negras</text>
</svg>
