<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Las teclas negras vienen en grupos de 2 y de 3</text>

  <!-- Group labels -->
  <g text-anchor="middle" font-size="20" font-weight="bold">
    <text x="100" y="70" fill="#16A34A">2</text>
    <text x="240" y="70" fill="#EA7317">3</text>
    <text x="380" y="70" fill="#16A34A">2</text>
    <text x="520" y="70" fill="#EA7317">3</text>
  </g>

  <!-- White keys: 14 (dos octavas) -->
  <g fill="#ffffff" stroke="#333333" stroke-width="1.8">
    <rect x="40"  y="80" width="40" height="160" rx="2"/>
    <rect x="80"  y="80" width="40" height="160" rx="2"/>
    <rect x="120" y="80" width="40" height="160" rx="2"/>
    <rect x="160" y="80" width="40" height="160" rx="2"/>
    <rect x="200" y="80" width="40" height="160" rx="2"/>
    <rect x="240" y="80" width="40" height="160" rx="2"/>
    <rect x="280" y="80" width="40" height="160" rx="2"/>
    <rect x="320" y="80" width="40" height="160" rx="2"/>
    <rect x="360" y="80" width="40" height="160" rx="2"/>
    <rect x="400" y="80" width="40" height="160" rx="2"/>
    <rect x="440" y="80" width="40" height="160" rx="2"/>
    <rect x="480" y="80" width="40" height="160" rx="2"/>
    <rect x="520" y="80" width="40" height="160" rx="2"/>
    <rect x="560" y="80" width="40" height="160" rx="2"/>
  </g>

  <!-- Black keys: 2-groups GREEN, 3-groups ORANGE -->
  <g>
    <rect x="68"  y="80" width="24" height="105" rx="2" fill="#16A34A"/>
    <rect x="108" y="80" width="24" height="105" rx="2" fill="#16A34A"/>
    <rect x="188" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
    <rect x="228" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
    <rect x="268" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
    <rect x="348" y="80" width="24" height="105" rx="2" fill="#16A34A"/>
    <rect x="388" y="80" width="24" height="105" rx="2" fill="#16A34A"/>
    <rect x="468" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
    <rect x="508" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
    <rect x="548" y="80" width="24" height="105" rx="2" fill="#EA7317"/>
  </g>

  <text x="320" y="270" text-anchor="middle" font-size="14" fill="#666666">2, luego 3, y se repite por todo el teclado</text>
</svg>
