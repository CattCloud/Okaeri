<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">El tiempo fuerte: el 1 se siente más que los otros tres</text>
  <text x="60" y="64" text-anchor="start" font-size="13.5" fill="#555555">Cada barra es un pulso; su altura muestra cuánto se marca al contar en voz alta.</text>
  <!-- línea base -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#dddddd" stroke-width="1.5"/>
  <!-- barras compás 1 -->
  <rect x="190" y="110" width="50" height="140" fill="#d23333"/>
  <rect x="270" y="190" width="50" height="60" fill="#555555"/>
  <rect x="350" y="190" width="50" height="60" fill="#555555"/>
  <rect x="430" y="190" width="50" height="60" fill="#555555"/>
  <!-- barras compás 2 -->
  <rect x="540" y="110" width="50" height="140" fill="#d23333"/>
  <rect x="620" y="190" width="50" height="60" fill="#555555"/>
  <rect x="700" y="190" width="50" height="60" fill="#555555"/>
  <rect x="780" y="190" width="50" height="60" fill="#555555"/>
  <!-- barras de compás -->
  <line x1="160" y1="100" x2="160" y2="262" stroke="#111111" stroke-width="3"/>
  <line x1="510" y1="100" x2="510" y2="262" stroke="#111111" stroke-width="3"/>
  <!-- números -->
  <text x="215" y="282" text-anchor="middle" font-size="20" font-weight="bold" fill="#d23333">1</text>
  <text x="295" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">2</text>
  <text x="375" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">3</text>
  <text x="455" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">4</text>
  <text x="565" y="282" text-anchor="middle" font-size="20" font-weight="bold" fill="#d23333">1</text>
  <text x="645" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">2</text>
  <text x="725" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">3</text>
  <text x="805" y="282" text-anchor="middle" font-size="17" font-weight="bold" fill="#555555">4</text>
  <!-- sílabas -->
  <text x="215" y="316" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">a</text>
  <text x="295" y="316" text-anchor="middle" font-size="17" fill="#111111">le</text>
  <text x="375" y="316" text-anchor="middle" font-size="17" fill="#111111">lu</text>
  <text x="455" y="316" text-anchor="middle" font-size="17" fill="#111111">ya</text>
  <text x="565" y="316" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">a</text>
  <text x="645" y="316" text-anchor="middle" font-size="17" fill="#111111">le</text>
  <text x="725" y="316" text-anchor="middle" font-size="17" fill="#111111">lu</text>
  <text x="805" y="316" text-anchor="middle" font-size="17" fill="#111111">ya</text>
  <!-- etiquetas -->
  <text x="215" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d23333">tiempo fuerte</text>
  <text x="565" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d23333">tiempo fuerte</text>
  <text x="450" y="362" text-anchor="middle" font-size="13.5" fill="#111111">Una frase suele empezar en el tiempo fuerte: la <tspan font-weight="bold">a</tspan> de cada <tspan font-style="italic">a-le-lu-ya</tspan> cae en el 1.</text>
</svg>
