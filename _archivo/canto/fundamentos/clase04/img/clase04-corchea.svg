<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">La corchea: dos por cada pulso</text>
  <text x="60" y="70" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">Una negra dura 1 pulso. Una corchea dura medio pulso, y caben dos en cada pulso.</text>
  <text x="60" y="148" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">4 negras</text>
  <rect x="210" y="100" width="480" height="80" fill="none" stroke="#111111" stroke-width="1.8"/>
  <line x1="330" y1="100" x2="330" y2="180" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="100" x2="450" y2="180" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="570" y1="100" x2="570" y2="180" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="250" cy="160" rx="10" ry="7" fill="#111111" stroke="#111111" stroke-width="2.4"/>
  <line x1="259" y1="158" x2="259" y2="116" stroke="#111111" stroke-width="2.4" />
  <text x="250" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1</text>
  <ellipse cx="370" cy="160" rx="10" ry="7" fill="#111111" stroke="#111111" stroke-width="2.4"/>
  <line x1="379" y1="158" x2="379" y2="116" stroke="#111111" stroke-width="2.4" />
  <text x="370" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2</text>
  <ellipse cx="490" cy="160" rx="10" ry="7" fill="#111111" stroke="#111111" stroke-width="2.4"/>
  <line x1="499" y1="158" x2="499" y2="116" stroke="#111111" stroke-width="2.4" />
  <text x="490" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">3</text>
  <ellipse cx="610" cy="160" rx="10" ry="7" fill="#111111" stroke="#111111" stroke-width="2.4"/>
  <line x1="619" y1="158" x2="619" y2="116" stroke="#111111" stroke-width="2.4" />
  <text x="610" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">4</text>
  <text x="60" y="288" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">8 corcheas</text>
  <rect x="210" y="240" width="480" height="80" fill="none" stroke="#111111" stroke-width="1.8"/>
  <line x1="330" y1="240" x2="330" y2="320" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="240" x2="450" y2="320" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="570" y1="240" x2="570" y2="320" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="235" cy="302" rx="10" ry="7" fill="#111111"/>
  <ellipse cx="285" cy="302" rx="10" ry="7" fill="#111111"/>
  <line x1="244" y1="300" x2="244" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="294" y1="300" x2="294" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="244" y1="259" x2="294" y2="259" stroke="#111111" stroke-width="6"/>
  <text x="235" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1</text>
  <text x="285" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#d23333">y</text>
  <ellipse cx="355" cy="302" rx="10" ry="7" fill="#111111"/>
  <ellipse cx="405" cy="302" rx="10" ry="7" fill="#111111"/>
  <line x1="364" y1="300" x2="364" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="414" y1="300" x2="414" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="364" y1="259" x2="414" y2="259" stroke="#111111" stroke-width="6"/>
  <text x="355" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2</text>
  <text x="405" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#d23333">y</text>
  <ellipse cx="475" cy="302" rx="10" ry="7" fill="#111111"/>
  <ellipse cx="525" cy="302" rx="10" ry="7" fill="#111111"/>
  <line x1="484" y1="300" x2="484" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="534" y1="300" x2="534" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="484" y1="259" x2="534" y2="259" stroke="#111111" stroke-width="6"/>
  <text x="475" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">3</text>
  <text x="525" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#d23333">y</text>
  <ellipse cx="595" cy="302" rx="10" ry="7" fill="#111111"/>
  <ellipse cx="645" cy="302" rx="10" ry="7" fill="#111111"/>
  <line x1="604" y1="300" x2="604" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="654" y1="300" x2="654" y2="258" stroke="#111111" stroke-width="2.4" />
  <line x1="604" y1="259" x2="654" y2="259" stroke="#111111" stroke-width="6"/>
  <text x="595" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">4</text>
  <text x="645" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#d23333">y</text>
  <text x="450" y="378" text-anchor="middle" font-size="13.5"  fill="#111111">La cuenta: «1 y 2 y 3 y 4 y». El número cae en el pulso; la «y» cae justo en la mitad.</text>
  <text x="450" y="402" text-anchor="middle" font-size="12.5"  fill="#555555">Dos corcheas juntas llevan una barra que las une (la barra reemplaza el corchete de la corchea sola).</text>
</svg>
