<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">El silencio de corchea: la mitad de un pulso sin sonido</text>
  <text x="260" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Pulso 1: dos mitades</text>
  <rect x="100" y="90" width="320" height="130" fill="none" stroke="#111111" stroke-width="1.8"/>
  <line x1="260" y1="90" x2="260" y2="220" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="640" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Pulso 2: dos mitades</text>
  <rect x="480" y="90" width="320" height="130" fill="none" stroke="#111111" stroke-width="1.8"/>
  <line x1="640" y1="90" x2="640" y2="220" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="172" cy="190" rx="17" ry="12" fill="#111111"/>
  <line x1="188" y1="188" x2="188" y2="118" stroke="#111111" stroke-width="3"/>
  <path d="M 188 118 C 195 134 212 140 206 166 C 204 150 196 146 188 144 Z" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <g transform="translate(-452,-26)">
    <circle cx="783" cy="176" r="4.5" fill="#555555"/>
    <path d="M 786 177 Q 798 178 801 168" fill="none" stroke="#555555" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 801 168 L 786 216" fill="none" stroke="#555555" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(-232,-26)">
    <circle cx="783" cy="176" r="4.5" fill="#555555"/>
    <path d="M 786 177 Q 798 178 801 168" fill="none" stroke="#555555" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 801 168 L 786 216" fill="none" stroke="#555555" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <ellipse cx="712" cy="190" rx="17" ry="12" fill="#111111"/>
  <line x1="728" y1="188" x2="728" y2="118" stroke="#111111" stroke-width="3"/>
  <path d="M 728 118 C 735 134 752 140 746 166 C 744 150 736 146 728 144 Z" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">1</text>
  <text x="180" y="274" text-anchor="middle" font-size="13" fill="#555555">suena</text>
  <text x="340" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#555555">(y)</text>
  <text x="340" y="274" text-anchor="middle" font-size="13" fill="#555555">silencio de corchea</text>
  <text x="560" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#555555">(2)</text>
  <text x="560" y="274" text-anchor="middle" font-size="13" fill="#555555">silencio de corchea</text>
  <text x="720" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#d23333">y</text>
  <text x="720" y="274" text-anchor="middle" font-size="13" fill="#555555">suena</text>
  <text x="450" y="322" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e9e44">Corchea + silencio de corchea = ½ + ½ = 1 pulso, en cualquier orden.</text>
  <text x="450" y="350" text-anchor="middle" font-size="13" fill="#555555">Los números entre paréntesis son los que no suenan, pero se siguen contando.</text>
</svg>
