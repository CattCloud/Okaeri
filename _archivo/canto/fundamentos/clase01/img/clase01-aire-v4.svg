<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="350" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="24" font-weight="bold" fill="#111111">V4 · trino de labios</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Trino = labios sueltos que vibran con el aire, un «brrr» con voz.</text>
<text x="40" y="96" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">La sirena sube la voz y la baja sin cortar el trino; el sostenido la deja en una nota.</text>
<text x="40" y="130" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Sirena</text><text x="40" y="152" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">labios sueltos, «brrr» con voz</text><path d="M 60 290 C 140 290 190 212 250 212 C 310 212 340 290 420 290" fill="none" stroke="#2b6cb0" stroke-width="4"/><text x="250" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">hasta donde sea cómodo</text><text x="60" y="316" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">sube</text><text x="420" y="316" text-anchor="end" font-size="14" font-weight="normal" fill="#555555">baja</text><text x="240" y="316" text-anchor="middle" font-size="14" font-weight="normal" fill="#555555">de corrido, sin cortar</text><line x1="480" y1="116" x2="480" y2="320" stroke="#dddddd" stroke-width="1.5"/><text x="520" y="130" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Sostenido</text><text x="520" y="152" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">una sola nota cómoda, ~5 s</text><line x1="520" y1="225" x2="900" y2="225" stroke="#2b6cb0" stroke-width="4"/><text x="710" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">la misma nota, sin subir ni bajar</text><text x="710" y="262" text-anchor="middle" font-size="14" font-weight="normal" fill="#555555">la nota la das con un piano o una app de piano</text>
</svg>
