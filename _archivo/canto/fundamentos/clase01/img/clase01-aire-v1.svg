<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
<rect width="960" height="400" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="24" font-weight="bold" fill="#111111">V1 · respiración</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal" fill="#333333">Una mano en el abdomen y otra en el costado bajo. Los hombros se quedan quietos.</text>
<text x="250" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">1 · Inhala</text><text x="250" y="140" text-anchor="middle" font-size="15" font-weight="normal" fill="#333333">por la nariz, 4 segundos</text><line x1="180" y1="160" x2="320" y2="160" stroke="#333333" stroke-width="2.5"/><path d="M 198 160 L 198 290 Q 250 306 302 290 L 302 160" fill="none" stroke="#333333" stroke-width="2.5"/><rect x="228" y="238" width="44" height="22" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><rect x="286" y="258" width="34" height="20" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><line x1="198" y1="250" x2="164" y2="250" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="173.90491812587945,245.21537912477646 164,250 173.90491812587945,254.78462087522354" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><line x1="320" y1="268" x2="354" y2="268" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="344.0950818741206,272.78462087522354 354,268 344.0950818741206,263.21537912477646" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><line x1="250" y1="264" x2="250" y2="296" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="245.21537912477646,286.0950818741206 250,296 254.78462087522354,286.0950818741206" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><text x="250" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">las dos manos salen</text><text x="710" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2 · Suelta</text><text x="710" y="140" text-anchor="middle" font-size="15" font-weight="normal" fill="#333333">por la boca, 6 a 8 segundos</text><line x1="640" y1="160" x2="780" y2="160" stroke="#333333" stroke-width="2.5"/><path d="M 658 160 L 658 290 Q 710 306 762 290 L 762 160" fill="none" stroke="#333333" stroke-width="2.5"/><rect x="688" y="238" width="44" height="22" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><rect x="746" y="258" width="34" height="20" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/><line x1="622" y1="250" x2="656" y2="250" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="646.0950818741205,254.78462087522354 656,250 646.0950818741205,245.21537912477646" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><line x1="816" y1="268" x2="782" y2="268" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="791.9049181258795,263.21537912477646 782,268 791.9049181258795,272.78462087522354" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><line x1="710" y1="298" x2="710" y2="268" stroke="#2b6cb0" stroke-width="2.6"/><polyline points="714.7846208752235,277.9049181258794 710,268 705.2153791247765,277.9049181258794" fill="none" stroke="#2b6cb0" stroke-width="2.6"/><text x="710" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">las manos vuelven</text><line x1="480" y1="116" x2="480" y2="350" stroke="#dddddd" stroke-width="1.5"/>
<text x="40" y="382" text-anchor="start" font-size="14" font-weight="normal" fill="#555555">Respiración costo-diafragmática: el aire baja hacia el abdomen y las costillas bajas, no hacia el pecho.</text>
</svg>
