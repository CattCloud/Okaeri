<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Dónde resuena la voz</text>
  <path d="M 230 330 L 230 270 C 160 250 140 170 170 110 C 200 50 300 40 350 90 C 372 112 372 140 370 160 L 392 198 L 372 208 C 372 222 376 230 376 236 L 380 246 L 372 252 C 374 268 370 282 350 290 L 320 300 L 320 330" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 230 330 L 120 385 M 320 330 L 430 385 M 120 385 L 90 520 L 460 520 L 430 385" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="328" cy="165" rx="26" ry="30" fill="#2b6cb0" fill-opacity="0.35" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="354" y1="165" x2="560" y2="120" stroke="#2b6cb0" stroke-width="2" />
  <text x="572" y="118" text-anchor="start" font-size="16" font-weight="bold" fill="#2b6cb0">Nariz y cabeza</text>
  <text x="572" y="138" text-anchor="start" font-size="12.5"  fill="#555555">los espacios de la cara y la parte alta de la cabeza</text>
  <ellipse cx="345" cy="246" rx="28" ry="14" fill="#e8820c" fill-opacity="0.35" stroke="#e8820c" stroke-width="3"/>
  <line x1="373" y1="246" x2="560" y2="215" stroke="#e8820c" stroke-width="2" />
  <text x="572" y="213" text-anchor="start" font-size="16" font-weight="bold" fill="#e8820c">Boca</text>
  <text x="572" y="233" text-anchor="start" font-size="12.5"  fill="#555555">la forma de labios y lengua cambia el color</text>
  <ellipse cx="275" cy="318" rx="34" ry="22" fill="#2e9e44" fill-opacity="0.35" stroke="#2e9e44" stroke-width="3"/>
  <line x1="309" y1="318" x2="560" y2="310" stroke="#2e9e44" stroke-width="2" />
  <text x="572" y="308" text-anchor="start" font-size="16" font-weight="bold" fill="#2e9e44">Garganta</text>
  <text x="572" y="328" text-anchor="start" font-size="12.5"  fill="#555555">el espacio sobre las cuerdas vocales</text>
  <ellipse cx="275" cy="440" rx="80" ry="50" fill="#d23333" fill-opacity="0.35" stroke="#d23333" stroke-width="3"/>
  <line x1="355" y1="440" x2="560" y2="440" stroke="#d23333" stroke-width="2" />
  <text x="572" y="438" text-anchor="start" font-size="16" font-weight="bold" fill="#d23333">Pecho</text>
  <text x="572" y="458" text-anchor="start" font-size="12.5"  fill="#555555">el cuerpo vibra con los sonidos graves</text>
  <text x="450" y="548" text-anchor="middle" font-size="12.5"  fill="#555555">La voz nace en las cuerdas vocales (en el cuello) y se amplifica en estos espacios.</text>
</svg>
