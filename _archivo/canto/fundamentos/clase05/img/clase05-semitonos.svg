  <text x="730" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Do</text>
  <circle cx="730" cy="238" r="0" fill="none"/>
  <text x="730" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">12</text>
