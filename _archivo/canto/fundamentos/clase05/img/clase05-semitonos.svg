  <text x="570" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">La</text>
  <circle cx="570" cy="238" r="0" fill="none"/>
  <text x="570" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">9</text>
  <text x="650" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Si</text>
  <circle cx="650" cy="238" r="0" fill="none"/>
