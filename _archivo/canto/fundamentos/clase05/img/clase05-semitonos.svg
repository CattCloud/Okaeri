  <rect x="530" y="80" width="80" height="170" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="610" y="80" width="80" height="170" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="690" y="80" width="80" height="170" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="186.8" y="80" width="46.4" height="102" fill="#111111"/>
  <rect x="266.8" y="80" width="46.4" height="102" fill="#111111"/>
  <rect x="426.8" y="80" width="46.4" height="102" fill="#111111"/>
  <rect x="506.8" y="80" width="46.4" height="102" fill="#111111"/>
  <rect x="586.8" y="80" width="46.4" height="102" fill="#111111"/>
  <text x="170" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Do</text>
  <circle cx="170" cy="238" r="0" fill="none"/>
  <text x="170" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">0</text>
  <text x="250" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Re</text>
  <circle cx="250" cy="238" r="0" fill="none"/>
  <text x="250" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">2</text>
  <text x="330" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Mi</text>
  <circle cx="330" cy="238" r="0" fill="none"/>
  <text x="330" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">4</text>
  <text x="410" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Fa</text>
  <circle cx="410" cy="238" r="0" fill="none"/>
