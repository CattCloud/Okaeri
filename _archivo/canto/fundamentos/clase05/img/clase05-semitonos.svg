  <text x="610" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">10</text>
  <text x="450" y="62" text-anchor="middle" font-size="13.5"  fill="#111111">Cada número es un semitono más arriba que el anterior. Del 0 al 12 hay una octava.</text>
  <line x1="330" y1="298" x2="410" y2="298" stroke="#d23333" stroke-width="3" />
  <line x1="330" y1="292" x2="330" y2="304" stroke="#d23333" stroke-width="3" />
  <line x1="410" y1="292" x2="410" y2="304" stroke="#d23333" stroke-width="3" />
  <text x="370" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d23333">Mi y Fa: sin tecla negra</text>
  <line x1="650" y1="298" x2="730" y2="298" stroke="#d23333" stroke-width="3" />
  <line x1="650" y1="292" x2="650" y2="304" stroke="#d23333" stroke-width="3" />
  <line x1="730" y1="292" x2="730" y2="304" stroke="#d23333" stroke-width="3" />
  <text x="690" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d23333">Si y Do: sin tecla negra</text>
  <text x="450" y="372" text-anchor="middle" font-size="12.5"  fill="#555555">Entre esas dos parejas el semitono va de una tecla blanca a la siguiente.</text>
