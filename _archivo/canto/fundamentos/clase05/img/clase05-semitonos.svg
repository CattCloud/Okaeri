  <circle cx="290" cy="164" r="11" fill="#ffffff"/>
  <text x="290" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">3</text>
  <circle cx="450" cy="164" r="11" fill="#ffffff"/>
