<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 290" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="576" height="290" fill="#ffffff"/>
  <text x="288" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Cada dedo tiene un número — el pulgar es 1 en las dos manos</text>

  <!-- ===== MANO IZQUIERDA (pulgar a la derecha, hacia el centro) ===== -->
  <g fill="#f3f4f6" stroke="#444444" stroke-width="1.8">
    <rect x="120" y="150" width="96" height="72" rx="14"/>
    <rect x="132" y="122" width="18" height="40" rx="9"/>
    <rect x="154" y="108" width="18" height="54" rx="9"/>
    <rect x="176" y="102" width="18" height="60" rx="9"/>
    <rect x="198" y="112" width="18" height="50" rx="9"/>
    <rect x="216" y="198" width="46" height="18" rx="9"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">
    <circle cx="141" cy="136" r="12" fill="#8E2DE2"/><text x="141" y="141">5</text>
    <circle cx="163" cy="122" r="12" fill="#1565C0"/><text x="163" y="127">4</text>
    <circle cx="185" cy="116" r="12" fill="#16A34A"/><text x="185" y="121">3</text>
    <circle cx="207" cy="126" r="12" fill="#EA7317"/><text x="207" y="131">2</text>
    <circle cx="250" cy="207" r="12" fill="#E2342E"/><text x="250" y="212">1</text>
  </g>
  <text x="168" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">MANO IZQUIERDA</text>

  <!-- ===== MANO DERECHA (pulgar a la izquierda, hacia el centro) ===== -->
  <g fill="#f3f4f6" stroke="#444444" stroke-width="1.8">
    <rect x="360" y="150" width="96" height="72" rx="14"/>
    <rect x="372" y="112" width="18" height="50" rx="9"/>
    <rect x="394" y="102" width="18" height="60" rx="9"/>
    <rect x="416" y="108" width="18" height="54" rx="9"/>
    <rect x="438" y="122" width="18" height="40" rx="9"/>
    <rect x="314" y="198" width="46" height="18" rx="9"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">
    <circle cx="381" cy="126" r="12" fill="#EA7317"/><text x="381" y="131">2</text>
    <circle cx="403" cy="116" r="12" fill="#16A34A"/><text x="403" y="121">3</text>
    <circle cx="425" cy="122" r="12" fill="#1565C0"/><text x="425" y="127">4</text>
    <circle cx="447" cy="136" r="12" fill="#8E2DE2"/><text x="447" y="141">5</text>
    <circle cx="326" cy="207" r="12" fill="#E2342E"/><text x="326" y="212">1</text>
  </g>
  <text x="408" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">MANO DERECHA</text>

  <text x="288" y="278" text-anchor="middle" font-size="13" fill="#666666">Pulgar 1, índice 2, medio 3, anular 4, meñique 5. Los dos pulgares (1) miran al centro.</text>
</svg>
