"normal" fill="#bbb" font-family="Arial, Helvetica, sans-serif">Fa</text><text x="277" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="Arial, Helvetica, sans-serif">Sol</text><circle cx="93" cy="190" r="12" fill="#0b6b32"/><text x="93" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff" font-family="Arial, Helvetica, sans-serif">1</text><circle cx="185" cy="190" r="12" fill="#0b6b32"/><text x="185" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff" font-family="Arial, Helvetica, sans-serif">3</text><circle cx="277" cy="190" r="12" fill="#0b6b32"/><text x="277" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff" font-family="Arial, Helvetica, sans-serif">5</text><text x="254" y="262" text-anchor="middle" font-size="13" font-weight="normal" fill="#666" font-family="Arial, Helvetica, sans-serif">Se salta una tecla blanca entre cada nota (Re y Fa quedan fuera).</text></svg>
